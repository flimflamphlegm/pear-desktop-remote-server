<!DOCTYPE html>
<html lang="en">
<head>
    <title>YouTube Music Remote</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <style>
        * { box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            background: {{BACKGROUND_COLOR}}; 
            color: #fff; 
            text-align: center; 
            margin: 0; 
            padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            height: 100vh;
            height: 100dvh;
            overflow: hidden; 
        }
        .card { 
            background: {{CARD_BACKGROUND}}; 
            padding: 10px 14px; 
            border-radius: 20px; 
            border: 1px solid #222; 
            box-shadow: 0 10px 40px rgba(0,0,0,0.8); 
            width: 94%; 
            max-width: {{CARD_MAX_WIDTH}}; 
            max-height: 99vh; 
            max-height: 99dvh;
            display: flex;
            flex-direction: column;
            justify-content: flex-start; 
            margin: auto;
        }
        
        .art-box { 
            width: 100%; 
            max-height: 42vh; 
            position: relative; 
            margin: 0 auto 4px auto; 
            background: #1a1a1a; 
            border-radius: 12px; 
            overflow: hidden; 
            border: 1px solid #2a2a2a; 
            flex-shrink: 1; 
        }
        
        .art-box::after {
            content: "";
            display: block;
            padding-bottom: 100%; 
        }

        .art-box img { 
            position: absolute; 
            top: 0; left: 0; 
            width: 100%; height: 100%; 
            object-fit: cover; 
        }
        
        .art-placeholder { 
            position: absolute; 
            top: 50%; left: 50%; 
            transform: translate(-50%, -50%);
            font-size: 3rem; 
            opacity: 0.2; 
            margin: 0;
        }

        .meta-container {
            display: flex;
            flex-direction: column;
            gap: 1px;
            margin-bottom: 4px;
        }

        /* TRUE SCROLLING MARQUEE USING CSS TRANSFORMS */
        .marquee-container {
            width: 100%;
            overflow: hidden;
            white-space: nowrap;
            position: relative;
        }
        
        .marquee-inner {
            display: inline-block;
            white-space: nowrap;
            will-change: transform;
        }

        @keyframes marquee-scroll {
            0%, 10% { transform: translateX(0); }         /* Pause for 10% of the loop at the beginning */
            90%, 100% { transform: translateX(var(--scroll-distance)); } /* Pause for 10% of the loop at the end */
        }

        .marquee-inner.is-long {
            animation: marquee-scroll var(--scroll-duration) linear infinite;
        }

        h2.marquee-inner { 
            margin: 0 0 2px 0; 
            font-size: 1.5rem; 
            font-weight: 700;
            color: #fff; 
            line-height: 1.2; 
            padding-bottom: 2px; 
        }
        
        .track-sub.marquee-inner { 
            margin: 0; 
            font-size: 1.05rem; 
            color: #aaa; 
            font-weight: 500; 
            line-height: 1.2;
        }

        .progress-panel { margin-bottom: 4px; width: 100%; pointer-events: none; }
        .track-bar { 
            width: 100%; 
            height: {{TRACK_BAR_HEIGHT}}; 
            background: #282828; 
            border-radius: 4px; 
            position: relative; 
            overflow: hidden;
            cursor: default;
        }
        .track-fill { background: {{ACCENT_COLOR}}; height: 100%; width: 0%; transition: none; }
        
        .time-labels { 
            display: flex; 
            justify-content: space-between; 
            font-size: 0.85rem; 
            font-weight: 600;
            color: #888; 
            margin-top: 8px; 
            font-variant-numeric: tabular-nums; 
        }

        .controls { display: flex; justify-content: space-between; align-items: center; gap: 6px; margin-bottom: 4px; }
        
        button { 
            background: #212121; 
            color: #fff; 
            border: 1px solid #333; 
            padding: 10px 12px; 
            font-size: 0.9rem; 
            font-weight: bold; 
            border-radius: 30px; 
            cursor: pointer; 
            touch-action: manipulation;
            flex: 1;
            min-height: {{BUTTON_MIN_HEIGHT}};
            transition: transform 0.1s, background-color 0.2s; 
        }
        button:active { transform: scale(0.95); background: #333; }
        .btn-primary { background: {{ACCENT_COLOR}}; border: none; flex: 1.3; font-size: 0.95rem; }
        
        .vol-panel { display: flex; align-items: center; justify-content: space-between; margin-top: 6px; width: 100%; }
        
        .btn-vol { 
            background: #212121; 
            color: #fff; 
            width: 38px; 
            height: 38px; 
            min-height: 38px;
            padding: 0; 
            font-size: 1.2rem; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            border-radius: 50%; 
            border: 1px solid #333; 
            flex: none;
        }
        .btn-vol:active { background: #333; transform: scale(0.9); }
        .bar-container { 
            flex-grow: 1; 
            margin: 0 18px; 
            background: #212121; 
            height: 8px; 
            border-radius: 4px; 
            overflow: hidden; 
            position: relative; 
        }
        .bar-fill { background: {{ACCENT_COLOR}}; height: 100%; width: 50%; transition: width 0.15s ease-out; }

        @media (max-height: 600px) {
            .card { padding: 8px 12px; }
            .art-box { max-height: 35vh; }
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="art-box" id="art-container">
            <span class="art-placeholder" id="art-ph">🎵</span>
        </div>

        <div class="marquee-container">
            <h2 id="title-wrap" class="marquee-inner">
                <span id="title">YouTube Music</span><span id="title-clone" style="padding-left: 60px;"></span>
            </h2>
        </div>
        
        <div class="meta-container">
            <div class="marquee-container">
                <div id="artist-wrap" class="track-sub marquee-inner">
                    <span id="artist">Connecting...</span><span id="artist-clone" style="padding-left: 60px;"></span>
                </div>
            </div>
            <div class="marquee-container">
                <div id="album-wrap" class="track-sub marquee-inner">
                    <span id="album"></span><span id="album-clone" style="padding-left: 60px;"></span>
                </div>
            </div>
        </div>

        <div class="progress-panel">
            <div class="track-bar" id="track-bar">
                <div class="track-fill" id="track-fill"></div>
            </div>
            <div class="time-labels">
                <span id="time-elapsed">0:00</span>
                <span id="time-duration">0:00</span>
            </div>
        </div>

        <div class="controls">
            <button onclick="sendControl('prev')">❮ Prev</button>
            <button class="btn-primary" id="play-btn" onclick="sendControl('playpause')">Play ▶</button>
            <button onclick="sendControl('next')">Next ❯</button>
        </div>
        
        <div>
            <div class="vol-panel">
                <button class="btn-vol" onclick="sendControl('vol_down')">−</button>
                <div class="bar-container">
                    <div id="vol-bar" class="bar-fill"></div>
                </div>
                <button class="btn-vol" onclick="sendControl('vol_up')">+</button>
            </div>
        </div>
    </div>

    <script>
        let isSending = false;
        let currentArtwork = "";
        let activeSongSignature = "";

        let state = 'IDLE'; 
        let currentDuration = 0;
        let lastKnownElapsed = 0;
        let playStartTime = 0;

        let serverElapsed = 0;
        let isPaused = true;
        let lastServerSync = performance.now();

        function formatTime(secs) {
            if (isNaN(secs) || secs <= 0) return "0:00";
            let m = Math.floor(secs / 60);
            let s = Math.floor(secs % 60);
            return m + ":" + (s < 10 ? "0" : "") + s;
        }

        function clampElapsed(elapsed, duration) {
            if (duration <= 0) return 0;
            if (elapsed > duration) return duration;
            if (elapsed < 0) return 0;
            return elapsed;
        }

        function isValidElapsed(elapsed, duration) {
            if (!Number.isFinite(elapsed) || !Number.isFinite(duration)) return false;
            if (duration <= 0) return true;
            return elapsed >= 0 && elapsed <= duration;
        }

        function setupMarquee(prefix, text) {
            const wrap = document.getElementById(prefix + '-wrap');
            const mainText = document.getElementById(prefix);
            const cloneText = document.getElementById(prefix + '-clone');

            const safeText = text || "";
            mainText.innerText = safeText;
            cloneText.innerText = safeText;
            
            wrap.classList.remove('is-long');
            wrap.style.removeProperty('--scroll-distance');
            wrap.style.removeProperty('--scroll-duration');
            cloneText.style.display = 'none';

            void wrap.offsetWidth;

            // Measure just the text element itself against the container wrapper width
            if (mainText.offsetWidth > wrap.parentElement.clientWidth) {
                cloneText.style.display = 'inline';
                
                // Calculate exact distance to scroll so the loop wraps cleanly
                const distance = -(mainText.offsetWidth + 60);
                const duration = Math.max(6, Math.abs(distance) / 30);

                wrap.style.setProperty('--scroll-distance', distance + 'px');
                wrap.style.setProperty('--scroll-duration', duration + 's');
                wrap.classList.add('is-long');
            }
        }

        function updateMarquees(title, artist, album) {
            const newSignature = `${title}|${artist}|${album}`;
            
            if (newSignature !== activeSongSignature) {
                activeSongSignature = newSignature;

                requestAnimationFrame(() => {
                    setupMarquee('title', title);
                    setupMarquee('artist', artist);
                    setupMarquee('album', album);
                });
            }
        }

        function animLoop() {
            if (state === 'PLAYING' && currentDuration > 0) {
                const elapsedSincePlay = (performance.now() - playStartTime) / 1000;
                let currentElapsed = lastKnownElapsed + elapsedSincePlay;

                if (currentElapsed > currentDuration) currentElapsed = currentDuration;
                if (currentElapsed < 0) currentElapsed = 0;

                document.getElementById('time-elapsed').innerText = formatTime(currentElapsed);
                let pct = (currentElapsed / currentDuration) * 100;
                document.getElementById('track-fill').style.width = Math.min(100, Math.max(0, pct)) + "%";
            }
            requestAnimationFrame(animLoop);
        }
        requestAnimationFrame(animLoop);

        async function updateStatus() {
            try {
                let response = await fetch('/api/status');
                let data = await response.json();

                updateMarquees(data.title, data.artist, data.album || '');

                document.getElementById('vol-bar').style.width = data.volume + "%";

                let newIsPaused = data.isPaused !== undefined ? data.isPaused :
                                  (data.is_playing !== undefined ? !data.is_playing : true);
                let newElapsed = data.elapsed || 0;
                let newDuration = data.duration || 0;

                serverElapsed = newElapsed;
                isPaused = newIsPaused;

                if (newDuration !== currentDuration) {
                    currentDuration = newDuration;
                    lastKnownElapsed = clampElapsed(lastKnownElapsed, currentDuration);
                }

                const wasPaused = state !== 'PLAYING';
                const isNowPaused = newIsPaused;

                if (wasPaused && !isNowPaused) {
                    lastKnownElapsed = clampElapsed(newElapsed, currentDuration);
                    playStartTime = performance.now();
                    lastServerSync = playStartTime;
                    state = 'PLAYING';
                } else if (!wasPaused && isNowPaused) {
                    const elapsedSincePlay = (performance.now() - playStartTime) / 1000;
                    let finalElapsed = lastKnownElapsed + elapsedSincePlay;
                    finalElapsed = clampElapsed(finalElapsed, currentDuration);
                    lastKnownElapsed = finalElapsed;
                    state = 'PAUSED';
                } else if (!wasPaused && !isNowPaused) {
                    const elapsedSincePlay = (performance.now() - playStartTime) / 1000;
                    const currentEstimate = lastKnownElapsed + elapsedSincePlay;

                    if (isValidElapsed(newElapsed, newDuration) &&
                        Math.abs(currentEstimate - newElapsed) > 3.0) {
                        lastKnownElapsed = clampElapsed(newElapsed, currentDuration);
                        playStartTime = performance.now();
                        lastServerSync = playStartTime;
                    }
                    state = 'PLAYING';
                } else {
                    if (isValidElapsed(newElapsed, newDuration) &&
                        Math.abs(lastKnownElapsed - newElapsed) > 2.0) {
                        lastKnownElapsed = clampElapsed(newElapsed, currentDuration);
                    }
                    state = isNowPaused ? 'PAUSED' : (currentDuration > 0 ? 'PLAYING' : 'IDLE');
                }

                document.getElementById('play-btn').innerText = isNowPaused ? "Play ▶" : "Pause ❚❚";
                document.getElementById('time-duration').innerText = formatTime(currentDuration);

                if (isNowPaused) {
                    document.getElementById('time-elapsed').innerText = formatTime(lastKnownElapsed);
                    let pct = currentDuration > 0 ? (lastKnownElapsed / currentDuration) * 100 : 0;
                    document.getElementById('track-fill').style.width = Math.min(100, Math.max(0, pct)) + "%";
                }

                if (data.artwork && data.artwork !== currentArtwork) {
                    currentArtwork = data.artwork;
                    document.getElementById('art-container').innerHTML = `<img src="${data.artwork}" alt="Album Art">`;
                } else if (!data.artwork && currentArtwork !== "") {
                    currentArtwork = "";
                    document.getElementById('art-container').innerHTML = `<span class="art-placeholder">🎵</span>`;
                }
            } catch (e) {
                console.error("Sync error:", e);
            }
        }

        function sendControl(action) {
            if (isSending) return;
            isSending = true;

            fetch('/control/' + action).then(() => {
                setTimeout(() => {
                    updateStatus();
                    isSending = false;
                }, 200);
            }).catch(err => {
                console.error("Control error:", err);
                isSending = false;
            });
        }

        setInterval(updateStatus, {{POLL_INTERVAL_MS}});
        updateStatus();
    </script>
</body>
</html>
