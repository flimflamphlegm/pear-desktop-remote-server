<!DOCTYPE html>
<html lang="en">
<head>
    <title>YouTube Music Remote</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <style>
        * { box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            background: {{BACKGROUND_COLOR}}; 
            color: #fff; 
            text-align: center; 
            margin: 0; 
            padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            min-height: 100vh;
            min-height: 100dvh;
        }
        .card { 
            background: {{CARD_BACKGROUND}}; 
            padding: 24px 20px; 
            border-radius: 24px; 
            border: 1px solid #222; 
            box-shadow: 0 10px 40px rgba(0,0,0,0.8); 
            width: 90%; 
            max-width: {{CARD_MAX_WIDTH}}; 
            margin: auto;
        }
        
        .art-box { 
            width: 100%; 
            aspect-ratio: 1 / 1;
            max-height: {{ARTWORK_MAX_HEIGHT}};
            background: #1a1a1a; 
            border-radius: 16px; 
            margin-bottom: 18px; 
            overflow: hidden; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            border: 1px solid #2a2a2a; 
        }
        .art-box img { width: 100%; height: 100%; object-fit: cover; }
        .art-placeholder { font-size: 3rem; opacity: 0.2; }
        
        .meta-container {
            display: flex;
            flex-direction: column;
            gap: 4px;
            margin-bottom: 18px;
        }
        
        /* BUMPED UP TEXT SIZES */
        h2 { 
            margin: 0 0 4px 0; 
            font-size: 1.55rem; /* Much larger title */
            font-weight: 700;
            color: #fff; 
            white-space: nowrap; 
            overflow: hidden; 
            text-overflow: ellipsis; 
        }
        .track-sub { 
            margin: 0; 
            font-size: 1.05rem; /* Larger artist/album */
            color: #aaa; 
            font-weight: 500; 
            white-space: nowrap; 
            overflow: hidden; 
            text-overflow: ellipsis; 
        }

        .progress-panel { margin-bottom: 18px; width: 100%; pointer-events: none; }
        .track-bar { 
            width: 100%; 
            height: {{TRACK_BAR_HEIGHT}}; 
            background: #282828; 
            border-radius: 4px; 
            position: relative; 
            overflow: hidden;
            cursor: default;
        }
        .track-fill { background: {{ACCENT_COLOR}}; height: 100%; width: 0%; transition: none; }
        
        .time-labels { 
            display: flex; 
            justify-content: space-between; 
            font-size: 0.85rem; /* Larger track times */
            font-weight: 600;
            color: #888; 
            margin-top: 8px; 
            font-variant-numeric: tabular-nums; 
        }

        .controls { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 18px; }
        
        /* SLIMMER BUTTONS */
        button { 
            background: #212121; 
            color: #fff; 
            border: 1px solid #333; 
            padding: 10px 12px; /* Reduced vertical padding */
            font-size: 0.9rem; 
            font-weight: bold; 
            border-radius: 30px; 
            cursor: pointer; 
            touch-action: manipulation;
            flex: 1;
            min-height: {{BUTTON_MIN_HEIGHT}};
            transition: transform 0.1s, background-color 0.2s; 
        }
        button:active { transform: scale(0.95); background: #333; }
        .btn-primary { background: {{ACCENT_COLOR}}; border: none; flex: 1.3; font-size: 0.95rem; }
        
        .vol-panel { display: flex; align-items: center; justify-content: space-between; margin-top: 6px; width: 100%; }

        /* ... (keep .btn-vol as it is) ... */

        .bar-container { 
            flex-grow: 1; 
            margin: 0 18px; /* Forces exactly 18px of unbreakable space on left and right */
            background: #212121; 
            height: 8px; 
            border-radius: 4px; 
            overflow: hidden; 
            position: relative; 
        }
                
        /* SMALLER VOLUME BUTTONS */
        .btn-vol { 
            background: #212121; 
            color: #fff; 
            width: 38px;  /* Shrunk from 44px */
            height: 38px; 
            min-height: 38px;
            padding: 0; 
            font-size: 1.2rem; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            border-radius: 50%; 
            border: 1px solid #333; 
            flex: none;
        }
        .btn-vol:active { background: #333; transform: scale(0.9); }
        .bar-fill { background: {{ACCENT_COLOR}}; height: 100%; width: 50%; transition: width 0.15s ease-out; }

        @media (max-height: 600px) {
            .card { padding: 12px; }
            .art-box { max-height: 150px; margin-bottom: 10px; }
            h2 { font-size: 1.3rem; }
            .track-sub { font-size: 0.95rem; }
            .progress-panel { margin-bottom: 10px; }
            .controls { margin-bottom: 10px; }
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="art-box" id="art-container">
            <span class="art-placeholder" id="art-ph">🎵</span>
        </div>

        <h2 id="title">YouTube Music</h2>
        <div class="meta-container">
            <div id="artist" class="track-sub">Connecting...</div>
            <div id="album" class="track-sub"></div>
        </div>

        <div class="progress-panel">
            <div class="track-bar" id="track-bar">
                <div class="track-fill" id="track-fill"></div>
            </div>
            <div class="time-labels">
                <span id="time-elapsed">0:00</span>
                <span id="time-duration">0:00</span>
            </div>
        </div>

        <div class="controls">
            <button onclick="sendControl('prev')">❮ Prev</button>
            <button class="btn-primary" id="play-btn" onclick="sendControl('playpause')">Play ▶</button>
            <button onclick="sendControl('next')">Next ❯</button>
        </div>
        
        <div>
            <div class="vol-panel">
                <button class="btn-vol" onclick="sendControl('vol_down')">−</button>
                <div class="bar-container">
                    <div id="vol-bar" class="bar-fill"></div>
                </div>
                <button class="btn-vol" onclick="sendControl('vol_up')">+</button>
            </div>
        </div>
    </div>

    <script>
        let isSending = false;
        let currentArtwork = "";

        // Timing / state
        let state = 'IDLE'; // 'IDLE' | 'PLAYING' | 'PAUSED'
        let currentDuration = 0;
        let lastKnownElapsed = 0;
        let playStartTime = 0;

        // Legacy compat
        let serverElapsed = 0;
        let isPaused = true;
        let lastServerSync = performance.now();

        function formatTime(secs) {
            if (isNaN(secs) || secs <= 0) return "0:00";
            let m = Math.floor(secs / 60);
            let s = Math.floor(secs % 60);
            return m + ":" + (s < 10 ? "0" : "") + s;
        }

        function clampElapsed(elapsed, duration) {
            if (duration <= 0) return 0;
            if (elapsed > duration) return duration;
            if (elapsed < 0) return 0;
            return elapsed;
        }

        function isValidElapsed(elapsed, duration) {
            if (!Number.isFinite(elapsed) || !Number.isFinite(duration)) return false;
            if (duration <= 0) return true;
            return elapsed >= 0 && elapsed <= duration;
        }

        function animLoop() {
            if (state === 'PLAYING' && currentDuration > 0) {
                const elapsedSincePlay = (performance.now() - playStartTime) / 1000;
                let currentElapsed = lastKnownElapsed + elapsedSincePlay;

                if (currentElapsed > currentDuration) currentElapsed = currentDuration;
                if (currentElapsed < 0) currentElapsed = 0;

                document.getElementById('time-elapsed').innerText = formatTime(currentElapsed);
                let pct = (currentElapsed / currentDuration) * 100;
                document.getElementById('track-fill').style.width = Math.min(100, Math.max(0, pct)) + "%";
            }
            requestAnimationFrame(animLoop);
        }
        requestAnimationFrame(animLoop);

        async function updateStatus() {
            try {
                let response = await fetch('/api/status');
                let data = await response.json();

                document.getElementById('title').innerText = data.title;
                document.getElementById('artist').innerText = data.artist;
                document.getElementById('album').innerText = data.album || '';
                document.getElementById('vol-bar').style.width = data.volume + "%";

                let newIsPaused = data.isPaused !== undefined ? data.isPaused :
                                  (data.is_playing !== undefined ? !data.is_playing : true);
                let newElapsed = data.elapsed || 0;
                let newDuration = data.duration || 0;

                serverElapsed = newElapsed;
                isPaused = newIsPaused;

                if (newDuration !== currentDuration) {
                    currentDuration = newDuration;
                    lastKnownElapsed = clampElapsed(lastKnownElapsed, currentDuration);
                }

                const wasPaused = state !== 'PLAYING';
                const isNowPaused = newIsPaused;

                if (wasPaused && !isNowPaused) {
                    // PAUSED/IDLE → PLAYING
                    lastKnownElapsed = clampElapsed(newElapsed, currentDuration);
                    playStartTime = performance.now();
                    lastServerSync = playStartTime;
                    state = 'PLAYING';
                } else if (!wasPaused && isNowPaused) {
                    // PLAYING → PAUSED
                    const elapsedSincePlay = (performance.now() - playStartTime) / 1000;
                    let finalElapsed = lastKnownElapsed + elapsedSincePlay;
                    finalElapsed = clampElapsed(finalElapsed, currentDuration);
                    lastKnownElapsed = finalElapsed;
                    state = 'PAUSED';
                } else if (!wasPaused && !isNowPaused) {
                    // PLAYING → PLAYING: simple drift correction
                    const elapsedSincePlay = (performance.now() - playStartTime) / 1000;
                    const currentEstimate = lastKnownElapsed + elapsedSincePlay;

                    if (isValidElapsed(newElapsed, newDuration) &&
                        Math.abs(currentEstimate - newElapsed) > 3.0) {
                        lastKnownElapsed = clampElapsed(newElapsed, currentDuration);
                        playStartTime = performance.now();
                        lastServerSync = playStartTime;
                    }
                    state = 'PLAYING';
                } else {
                    // PAUSED → PAUSED or IDLE → IDLE
                    if (isValidElapsed(newElapsed, newDuration) &&
                        Math.abs(lastKnownElapsed - newElapsed) > 2.0) {
                        lastKnownElapsed = clampElapsed(newElapsed, currentDuration);
                    }
                    state = isNowPaused ? 'PAUSED' : (currentDuration > 0 ? 'PLAYING' : 'IDLE');
                }

                document.getElementById('play-btn').innerText = isNowPaused ? "Play ▶" : "Pause ❚❚";
                document.getElementById('time-duration').innerText = formatTime(currentDuration);

                if (isNowPaused) {
                    document.getElementById('time-elapsed').innerText = formatTime(lastKnownElapsed);
                    let pct = currentDuration > 0 ? (lastKnownElapsed / currentDuration) * 100 : 0;
                    document.getElementById('track-fill').style.width = Math.min(100, Math.max(0, pct)) + "%";
                }

                if (data.artwork && data.artwork !== currentArtwork) {
                    currentArtwork = data.artwork;
                    document.getElementById('art-container').innerHTML = `<img src="${data.artwork}" alt="Album Art">`;
                } else if (!data.artwork && currentArtwork !== "") {
                    currentArtwork = "";
                    document.getElementById('art-container').innerHTML = `<span class="art-placeholder">🎵</span>`;
                }
            } catch (e) {
                console.error("Sync error:", e);
            }
        }

        function sendControl(action) {
            if (isSending) return;
            isSending = true;

            fetch('/control/' + action).then(() => {
                setTimeout(() => {
                    updateStatus();
                    isSending = false;
                }, 200);
            }).catch(err => {
                console.error("Control error:", err);
                isSending = false;
            });
        }

        setInterval(updateStatus, {{POLL_INTERVAL_MS}});
        updateStatus();
    </script>
</body>
</html>
