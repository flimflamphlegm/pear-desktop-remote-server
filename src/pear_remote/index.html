<!DOCTYPE html>
<html lang="en">
<head>
    <title>YouTube Music Remote</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <style>
        * { box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: {{BACKGROUND_COLOR}}; color: #fff; text-align: center; margin: 0; padding: 6px env(safe-area-inset-right) 6px env(safe-area-inset-left); display: flex; flex-direction: column; align-items: center; justify-content: flex-start; min-height: 100vh; overflow: hidden; }
        .card { background: {{CARD_BACKGROUND}}; padding: 14px; border-radius: 20px; border: 1px solid #222; box-shadow: 0 10px 40px rgba(0,0,0,0.8); width: 94%; max-width: {{CARD_MAX_WIDTH}}; display: flex; flex-direction: column; justify-content: space-between; margin: auto; position: relative; overflow: hidden; }
        .card::before { content: ""; position: absolute; top: -40px; right: -40px; bottom: -40px; left: -40px; background-color: #151515; background-image: var(--artwork, none); background-position: center; background-size: cover; background-repeat: no-repeat; -webkit-filter: blur(28px) saturate(2.1) brightness(0.72); filter: blur(28px) saturate(2.1) brightness(0.72); opacity: 0.9; transform: scale(1.15); z-index: 0; pointer-events: none; }
        .card::after { content: ""; position: absolute; top: 0; right: 0; bottom: 0; left: 0; background: rgba(10,10,10,0.22); z-index: 1; pointer-events: none; }
        .art-box { width: 100%; position: relative; z-index: 2; margin: 0 auto 4px; background: transparent; border: none; border-radius: 0; overflow: visible; flex-shrink: 0; }
        .art-box::after { content: ""; display: block; padding-bottom: 100%; }
        .art-box img { position: absolute; top: 0; right: 0; bottom: 0; left: 0; z-index: 3; width: 100%; height: 100%; object-fit: cover; object-position: 50% 50%; display: block; border-radius: 12px; }
        .art-placeholder { position: absolute; top: 50%; left: 50%; z-index: 3; transform: translate(-50%, -50%); font-size: 3rem; opacity: 0.25; margin: 0; }
        .card > * { position: relative; z-index: 2; }
        .meta-container { display: flex; flex-direction: column; gap: 1px; margin-bottom: 4px; flex-shrink: 0; }
        .marquee-container { width: 100%; overflow: hidden; white-space: nowrap; position: relative; }
        .marquee-inner { display: inline-block; white-space: nowrap; will-change: transform; }
        @keyframes marquee-scroll { 0%, 10% { transform: translateX(0); } 90%, 100% { transform: translateX(var(--scroll-distance)); } }
        .marquee-inner.is-long { animation: marquee-scroll var(--scroll-duration) linear infinite; }
        h2.marquee-inner { margin: 0; font-size: 1.5rem; font-weight: 700;  color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,0.95), 0 0 8px rgba(0,0,0,0.9);  line-height: 1.1; padding-bottom: 0; }
        .track-sub.marquee-inner { margin: 0; font-size: 1.05rem; font-weight: 500; line-height: 1.2; color: #e0e0e0; text-shadow: 0 1px 2px rgba(0,0,0,0.95), 0 0 7px rgba(0,0,0,0.85); }
        .progress-panel { margin-bottom: 4px; width: 100%; pointer-events: none; flex-shrink: 0; }
        .track-bar { width: 100%; height: {{TRACK_BAR_HEIGHT}}; background: #282828; border-radius: 4px; overflow: hidden; }
        .track-fill { background: {{ACCENT_COLOR}}; height: 100%; width: 0%; }
        .time-labels { display: flex; justify-content: space-between; font-size: 0.85rem; font-weight: 600; color: #ddd; text-shadow: 0 1px 2px rgba(0,0,0,0.95); margin-top: 8px; font-variant-numeric: tabular-nums; }
        .controls { display: flex; align-items: center; justify-content: center; margin-bottom: 4px; flex-shrink: 0; height: 30px; }
        button { background: #212121; color: #fff; border: 1px solid #333; padding: 0 4px; margin: 0 3px; font-size: 0.75rem; font-weight: bold; border-radius: 30px; cursor: pointer; touch-action: manipulation; flex: 1; min-width: 0; height: {{BUTTON_MIN_HEIGHT}}; min-height: {{BUTTON_MIN_HEIGHT}}; display: flex; align-items: center; justify-content: center; line-height: normal; }
        button:active { transform: scale(0.95); background: #333; }
        .btn-primary { background: {{ACCENT_COLOR}}; border: none; flex: 1.3; font-size: 0.95rem; height: {{BUTTON_MIN_HEIGHT}}; min-height: {{BUTTON_MIN_HEIGHT}}; max-height: {{BUTTON_MIN_HEIGHT}}; display: flex; align-items: center; justify-content: center; }
        .vol-panel { display: flex; align-items: center; justify-content: space-between; margin-top: 6px; width: 100%; flex-shrink: 0; }
        .btn-vol { background: #212121; color: #fff; width: 38px; height: 38px; min-height: 38px; padding: 0; font-size: 1.2rem; display: flex; align-items: center; justify-content: center; border-radius: 50%; border: 1px solid #333; flex: none; }
        .bar-container { flex-grow: 1; margin: 0 18px; background: #212121; height: 8px; border-radius: 4px; overflow: hidden; }
        .bar-fill { background: {{ACCENT_COLOR}}; height: 100%; width: 50%; transition: width 0.15s ease-out; }
        
        /* Minimal mode styles */
        .minimal-controls { display: flex; align-items: center; justify-content: center; gap: 4px; margin: 10px 0; flex-shrink: 0; margin-top: auto; margin-bottom: 0; }
        .minimal-controls button { background: #212121; color: #aaa; border: 1px solid #333; width: 44px; height: 44px; min-width: 44px; min-height: 44px; padding: 0; border-radius: 10px; cursor: pointer; touch-action: manipulation; display: flex; align-items: center; justify-content: center; }
        .minimal-controls button:active { transform: scale(0.95); background: #333; }
        .minimal-controls button.active { background: #3a3a3a; border-color: #555; color: #fff; }
        .minimal-controls button svg { width: 20px; height: 20px; fill: currentColor; }
        .minimal-controls button.active-all { background: #3a3a3a; border-color: #555; color: #fff; }
        .minimal-controls button.active-one { background: #4a4a4a; border-color: #666; color: #fff; position: relative; }
        .minimal-controls button.active-one::after { content: "1"; position: absolute; bottom: 2px; right: 2px; font-size: 9px; font-weight: bold; color: #fff; background: #212121; padding: 2px 4px; border-radius: 6px; }
        .hidden { display: none !important; }

        @media (max-width: 320px) and (max-height: 700px) { .card { min-height: calc(100vh - 12px); max-height: calc(100vh - 12px); padding: 8px 10px; } .art-box { width: 240px; max-width: 78vw; margin-bottom: 10px; } h2.marquee-inner { font-size: 1.25rem; } .track-sub.marquee-inner { font-size: 0.9rem; } .meta-container { gap: 2px; margin-bottom: 3px; } .time-labels { margin-top: 4px; font-size: 0.75rem; } .progress-panel { margin-bottom: 2px; } .minimal-controls { margin-top: auto; margin-bottom: 0; } }
    </style>
</head>
<body>
    <div class="card">
        <div class="art-box" id="art-container"><span class="art-placeholder">🎵</span></div>
        <div class="marquee-container"><h2 id="title-wrap" class="marquee-inner"><span id="title">YouTube Music</span><span id="title-clone" style="padding-left: 60px;"></span></h2></div>
        <div class="meta-container"><div class="marquee-container"><div id="artist-wrap" class="track-sub marquee-inner"><span id="artist">Connecting...</span><span id="artist-clone" style="padding-left: 60px;"></span></div></div><div class="marquee-container"><div id="album-wrap" class="track-sub marquee-inner"><span id="album"></span><span id="album-clone" style="padding-left: 60px;"></span></div></div></div>
        <div class="progress-panel"><div class="track-bar"><div class="track-fill" id="track-fill"></div></div><div class="time-labels"><span id="time-elapsed">0:00</span><span id="time-duration">0:00</span></div></div>
        
        <!-- Standard controls -->
        <div class="controls" id="standard-controls"><button onclick="sendControl('prev')">❮ Prev</button><button class="btn-primary" id="play-btn" onclick="sendControl('playpause')">Play ▶</button><button onclick="sendControl('next')">Next ❯</button></div>
        
        <!-- Minimal mode 5-button layout -->
        <div class="minimal-controls hidden" id="minimal-controls">
            <button id="btn-shuffle" onclick="toggleShuffle()" title="Shuffle">
                <svg viewBox="0 0 24 24"><path d="M10.59 9.17L5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.46 20 9.5V4h-5.5zm.33 9.41l-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z"/></svg>
            </button>
            <button onclick="sendControl('prev')" title="Previous">
                <svg viewBox="0 0 24 24"><path d="M11 18V6l-8.5 6 8.5 6zm.5-6l8.5 6V6l-8.5 6z"/></svg>
            </button>
            <button id="btn-playpause" onclick="sendControl('playpause')" title="Play/Pause">⏯</button>
            <button onclick="sendControl('next')" title="Next">
                <svg viewBox="0 0 24 24"><path d="M4 18l8.5-6L4 6v12zm9-12v12h2V6h-2z"/></svg>
            </button>
            <button id="btn-repeat" onclick="cycleRepeat()" title="Repeat">
                <svg viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v6z"/></svg>
            </button>
        </div>
        
        <div class="vol-panel" id="vol-panel"><button class="btn-vol" onclick="sendControl('vol_down')">−</button><div class="bar-container"><div id="vol-bar" class="bar-fill"></div></div><button class="btn-vol" onclick="sendControl('vol_up')">+</button></div>
    </div>
    <script>
        let isSending = false;
        let currentArtwork = "";
        let activeSongSignature = "";
        let state = 'IDLE';
        let currentDuration = 0;
        let lastKnownElapsed = 0;
        let playStartTime = 0;
        const EMPTY_ALBUM_TEXT = '(ﾉ◕ヮ◕) ﾉ*:･ﾟ✧';
        
        // Minimal mode state
        let isMinimalMode = {{MINIMAL_MODE}};
        let currentShuffleState = false;
        let currentRepeatMode = 'NONE';


        function formatTime(secs) {
            if (isNaN(secs) || secs <= 0) return "0:00";
            const minutes = Math.floor(secs / 60);
            const seconds = Math.floor(secs % 60);
            return minutes + ":" + (seconds < 10 ? "0" : "") + seconds;
        }


        function clampElapsed(elapsed, duration) {
            if (duration <= 0) return 0;
            return Math.max(0, Math.min(elapsed, duration));
        }


        function isValidElapsed(elapsed, duration) {
            return Number.isFinite(elapsed) && Number.isFinite(duration) && (duration <= 0 || (elapsed >= 0 && elapsed <= duration));
        }


        function setupMarquee(prefix, text) {
            const wrap = document.getElementById(prefix + '-wrap');
            const mainText = document.getElementById(prefix);
            const cloneText = document.getElementById(prefix + '-clone');
            mainText.innerText = text || "";
            cloneText.innerText = text || "";
            wrap.classList.remove('is-long');
            wrap.style.removeProperty('--scroll-distance');
            wrap.style.removeProperty('--scroll-duration');
            cloneText.style.display = 'none';
            void wrap.offsetWidth;
            if (mainText.offsetWidth > wrap.parentElement.clientWidth) {
                cloneText.style.display = 'inline';
                const distance = -(mainText.offsetWidth + 60);
                wrap.style.setProperty('--scroll-distance', distance + 'px');
                wrap.style.setProperty('--scroll-duration', Math.max(6, Math.abs(distance) / 30) + 's');
                wrap.classList.add('is-long');
            }
        }


        function updateMarquees(title, artist, album) {
            const signature = `${title}|${artist}|${album}`;
            if (signature === activeSongSignature) return;
            activeSongSignature = signature;
            requestAnimationFrame(() => {
                setupMarquee('title', title);
                setupMarquee('artist', artist);
                setupMarquee('album', album);
            });
        }


        function updateArtwork(artwork) {
            const container = document.getElementById('art-container');
            const card = document.querySelector('.card');

            if (artwork && artwork !== currentArtwork) {
                currentArtwork = artwork;
                card.style.setProperty('--artwork', `url("${artwork}")`);
                container.innerHTML = `<img src="${artwork}" alt="Album Art">`;
            } else if (!artwork && currentArtwork !== "") {
                currentArtwork = "";
                card.style.removeProperty('--artwork');
                container.innerHTML = `<span class="art-placeholder">🎵</span>`;
            }
        }

        function updateProgress(data) {
            const isPaused = data.isPaused !== undefined ? data.isPaused : !data.is_playing;
            const elapsed = Number(data.elapsed) || 0;
            const duration = Number(data.duration) || 0;
            const wasPlaying = state === 'PLAYING';

            if (duration !== currentDuration) {
                currentDuration = duration;
                lastKnownElapsed = clampElapsed(lastKnownElapsed, duration);
            }

            if (!wasPlaying && !isPaused) {
                lastKnownElapsed = clampElapsed(elapsed, duration);
                playStartTime = performance.now();
                state = 'PLAYING';
            } else if (wasPlaying && isPaused) {
                lastKnownElapsed = isValidElapsed(elapsed, duration)
                    ? elapsed
                    : clampElapsed(
                        lastKnownElapsed + (performance.now() - playStartTime) / 1000,
                        duration
                    );
                state = 'PAUSED';
            } else if (wasPlaying && !isPaused && isValidElapsed(elapsed, duration)) {
                const estimate = lastKnownElapsed + (performance.now() - playStartTime) / 1000;

                if (Math.abs(estimate - elapsed) > 3) {
                    lastKnownElapsed = elapsed;
                    playStartTime = performance.now();
                }
            } else if (!wasPlaying && isValidElapsed(elapsed, duration)) {
                lastKnownElapsed = elapsed;
                state = isPaused ? 'PAUSED' : 'PLAYING';
            }

            const playButton = document.getElementById('play-btn');
            const minimalPlayButton = document.getElementById('btn-playpause');
            const elapsedLabel = document.getElementById('time-elapsed');
            const durationLabel = document.getElementById('time-duration');
            const trackFill = document.getElementById('track-fill');

            if (playButton) {
                playButton.innerText = isPaused ? 'Play ▶' : 'Pause ❚❚';
            }

            if (minimalPlayButton) {
                minimalPlayButton.innerText = isPaused ? '▶' : '❚❚';
            }

            if (durationLabel) {
                durationLabel.innerText = formatTime(currentDuration);
            }

            if (isPaused && elapsedLabel && trackFill) {
                elapsedLabel.innerText = formatTime(lastKnownElapsed);
                trackFill.style.width =
                    (currentDuration ? (lastKnownElapsed / currentDuration) * 100 : 0) + '%';
            }
        }

        function animateProgress() {
            if (state === 'PLAYING' && currentDuration > 0) {
                const elapsed = clampElapsed(lastKnownElapsed + (performance.now() - playStartTime) / 1000, currentDuration);
                document.getElementById('time-elapsed').innerText = formatTime(elapsed);
                document.getElementById('track-fill').style.width = (elapsed / currentDuration * 100) + '%';
            }
            requestAnimationFrame(animateProgress);
        }
        requestAnimationFrame(animateProgress);


        async function updateStatus() {
            try {
                const response = await fetch('/api/status');
                const data = await response.json();
                updateMarquees(data.title, data.artist, data.album || EMPTY_ALBUM_TEXT);
                if (!isMinimalMode) {
                    document.getElementById('vol-bar').style.width = Math.max(0, Math.min(100, Number(data.volume) || 0)) + '%';
                }
                updateProgress(data);
                updateArtwork(data.artwork);
            } catch (error) {
                console.error('Sync error:', error);
            }
        }


        async function updateShuffleState() {
            try {
                const response = await fetch('/api/v1/shuffle');
                const data = await response.json();
                currentShuffleState = data.state;
                document.getElementById('btn-shuffle').classList.toggle('active', currentShuffleState);
            } catch (error) {
                console.error('Shuffle state error:', error);
            }
        }


        async function updateRepeatState() {
            try {
                const response = await fetch('/api/v1/repeat-mode');
                const data = await response.json();
                currentRepeatMode = data.mode;
                const btn = document.getElementById('btn-repeat');
                
                // Reset all states
                btn.classList.remove('active-all', 'active-one');
                
                // Apply appropriate state
                if (currentRepeatMode === 'ALL') {
                    btn.classList.add('active-all');
                } else if (currentRepeatMode === 'ONE') {
                    btn.classList.add('active-one');
                }
                // NONE = no class, stays grey
            } catch (error) {
                console.error('Repeat state error:', error);
            }
        }

        function sendControl(action) {
            if (isSending) return;
            isSending = true;

            fetch('/control/' + encodeURIComponent(action))
                .then(response => {
                    if (!response.ok) {
                        throw new Error(`Control request failed: ${response.status}`);
                    }
                    return new Promise(resolve => setTimeout(resolve, 250));
                })
                .then(() => updateStatus())
                .catch(error => console.error('Control error:', error))
                .finally(() => {
                    isSending = false;
                });
        }

        async function toggleShuffle() {
            try {
                await fetch('/api/v1/shuffle', { method: 'POST' });
                await updateShuffleState();
            } catch (error) {
                console.error('Shuffle toggle error:', error);
            }
        }


        async function cycleRepeat() {
            try {
                await fetch('/api/v1/switch-repeat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ iteration: 1 })
                });
                await updateRepeatState();
            } catch (error) {
                console.error('Repeat cycle error:', error);
            }
        }

        function setupMinimalMode() {
            const standardControls = document.getElementById('standard-controls');
            const minimalControls = document.getElementById('minimal-controls');
            const volPanel = document.getElementById('vol-panel');
            
            if (isMinimalMode) {
                standardControls.classList.add('hidden');
                minimalControls.classList.remove('hidden');
                volPanel.classList.add('hidden');
                updateShuffleState();
                updateRepeatState();
                // Get initial play/pause state from server
                fetch('/api/status')
                    .then(r => r.json())
                    .then(data => {
                        const isPaused = data.isPaused !== undefined ? data.isPaused : !data.is_playing;
                        document.getElementById('btn-playpause').innerText = isPaused ? '▶' : '❚❚';
                    })
                    .catch(() => {});
            } else {
                standardControls.classList.remove('hidden');
                minimalControls.classList.add('hidden');
                volPanel.classList.remove('hidden');
            }
        }

        setInterval(updateStatus, {{POLL_INTERVAL_MS}});
        setInterval(() => {
            if (isMinimalMode) {
                updateShuffleState();
                updateRepeatState();
            }
        }, 3000);
        updateStatus();
        setupMinimalMode();
    </script>
</body>
</html>
