<!DOCTYPE html>
<html lang="en">
<head>
    <title>YouTube Music Remote</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <style>
        * { box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: {{BACKGROUND_COLOR}}; color: #fff; text-align: center; margin: 0; padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; height: 100dvh; overflow: hidden; }
        .card { background: {{CARD_BACKGROUND}}; padding: 10px 14px; border-radius: 20px; border: 1px solid #222; box-shadow: 0 10px 40px rgba(0,0,0,0.8); width: 94%; max-width: {{CARD_MAX_WIDTH}}; max-height: 99vh; max-height: 99dvh; min-height: 0; display: flex; flex-direction: column; justify-content: flex-start; margin: auto; }
        .art-box { width: 100%; flex: 1 1 auto; min-height: 0; max-height: min({{ARTWORK_MAX_HEIGHT}}, 42vh); position: relative; margin: 0 auto 4px auto; background: #1a1a1a; border-radius: 12px; overflow: hidden; border: 1px solid #2a2a2a; }
        .art-box::after { content: ""; display: block; padding-bottom: 100%; }
        .art-box img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
        .art-placeholder { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 3rem; opacity: 0.2; margin: 0; }
        .meta-container { display: flex; flex-direction: column; gap: 4px; margin-bottom: 4px; flex-shrink: 0; }
        .marquee-container { width: 100%; overflow: hidden; white-space: nowrap; position: relative; }
        .marquee-inner { display: inline-block; white-space: nowrap; will-change: transform; }
        @keyframes marquee-scroll { 0%, 10% { transform: translateX(0); } 90%, 100% { transform: translateX(var(--scroll-distance)); } }
        .marquee-inner.is-long { animation: marquee-scroll var(--scroll-duration) linear infinite; }
        h2.marquee-inner { margin: 0 0 2px; font-size: 1.5rem; font-weight: 700; color: #fff; line-height: 1.2; padding-bottom: 2px; }
        .track-sub.marquee-inner { margin: 0; font-size: 1.05rem; color: #aaa; font-weight: 500; line-height: 1.2; }
        .progress-panel { margin-bottom: 4px; width: 100%; pointer-events: none; flex-shrink: 0; }
        .track-bar { width: 100%; height: {{TRACK_BAR_HEIGHT}}; background: #282828; border-radius: 4px; overflow: hidden; }
        .track-fill { background: {{ACCENT_COLOR}}; height: 100%; width: 0%; }
        .time-labels { display: flex; justify-content: space-between; font-size: 0.85rem; font-weight: 600; color: #888; margin-top: 8px; font-variant-numeric: tabular-nums; }
        .controls { display: flex; justify-content: space-between; align-items: center; gap: 6px; margin-bottom: 4px; flex-shrink: 0; }
        button { background: #212121; color: #fff; border: 1px solid #333; padding: 10px 12px; font-size: 0.9rem; font-weight: bold; border-radius: 30px; cursor: pointer; touch-action: manipulation; flex: 1; min-height: {{BUTTON_MIN_HEIGHT}}; transition: transform 0.1s, background-color 0.2s; }
        button:active { transform: scale(0.95); background: #333; }
        .btn-primary { background: {{ACCENT_COLOR}}; border: none; flex: 1.3; font-size: 0.95rem; }
        .vol-panel { display: flex; align-items: center; justify-content: space-between; margin-top: 6px; width: 100%; flex-shrink: 0; }
        .btn-vol { background: #212121; color: #fff; width: 38px; height: 38px; min-height: 38px; padding: 0; font-size: 1.2rem; display: flex; align-items: center; justify-content: center; border-radius: 50%; border: 1px solid #333; flex: none; }
        .bar-container { flex-grow: 1; margin: 0 18px; background: #212121; height: 8px; border-radius: 4px; overflow: hidden; }
        .bar-fill { background: {{ACCENT_COLOR}}; height: 100%; width: 50%; transition: width 0.15s ease-out; }
        @media (max-height: 600px) { .card { padding: 8px 12px; } }
        @media (max-height: 480px) { .card { padding: 6px 10px; } .time-labels { margin-top: 4px; } button { padding-top: 7px; padding-bottom: 7px; } }
    </style>
</head>
<body>
    <div class="card">
        <div class="art-box" id="art-container"><span class="art-placeholder">🎵</span></div>
        <div class="marquee-container"><h2 id="title-wrap" class="marquee-inner"><span id="title">YouTube Music</span><span id="title-clone" style="padding-left: 60px;"></span></h2></div>
        <div class="meta-container"><div class="marquee-container"><div id="artist-wrap" class="track-sub marquee-inner"><span id="artist">Connecting...</span><span id="artist-clone" style="padding-left: 60px;"></span></div></div><div class="marquee-container"><div id="album-wrap" class="track-sub marquee-inner"><span id="album"></span><span id="album-clone" style="padding-left: 60px;"></span></div></div></div>
        <div class="progress-panel"><div class="track-bar"><div class="track-fill" id="track-fill"></div></div><div class="time-labels"><span id="time-elapsed">0:00</span><span id="time-duration">0:00</span></div></div>
        <div class="controls"><button onclick="sendControl('prev')">❮ Prev</button><button class="btn-primary" id="play-btn" onclick="sendControl('playpause')">Play ▶</button><button onclick="sendControl('next')">Next ❯</button></div>
        <div class="vol-panel"><button class="btn-vol" onclick="sendControl('vol_down')">−</button><div class="bar-container"><div id="vol-bar" class="bar-fill"></div></div><button class="btn-vol" onclick="sendControl('vol_up')">+</button></div>
    </div>
    <script>
        let isSending = false, currentArtwork = "", activeSongSignature = "", state = 'IDLE', currentDuration = 0, lastKnownElapsed = 0, playStartTime = 0;
        const EMPTY_ALBUM_TEXT = '(ﾉ◕ヮ◕)ﾉ*:･ﾟ✧';
        function formatTime(secs) { if (!Number.isFinite(secs) || secs <= 0) return "0:00"; const m = Math.floor(secs / 60), s = Math.floor(secs % 60); return m + ":" + (s < 10 ? "0" : "") + s; }
        function clampElapsed(elapsed, duration) { return duration > 0 ? Math.max(0, Math.min(elapsed, duration)) : 0; }
        function setupMarquee(prefix, text) { const wrap = document.getElementById(prefix + '-wrap'), main = document.getElementById(prefix), clone = document.getElementById(prefix + '-clone'); main.innerText = text || ""; clone.innerText = text || ""; wrap.classList.remove('is-long'); wrap.style.removeProperty('--scroll-distance'); wrap.style.removeProperty('--scroll-duration'); clone.style.display = 'none'; void wrap.offsetWidth; if (main.offsetWidth > wrap.parentElement.clientWidth) { clone.style.display = 'inline'; const distance = -(main.offsetWidth + 60); wrap.style.setProperty('--scroll-distance', distance + 'px'); wrap.style.setProperty('--scroll-duration', Math.max(6, Math.abs(distance) / 30) + 's'); wrap.classList.add('is-long'); } }
        function updateMarquees(title, artist, album) { const signature = `${title}|${artist}|${album}`; if (signature === activeSongSignature) return; activeSongSignature = signature; requestAnimationFrame(() => { setupMarquee('title', title); setupMarquee('artist', artist); setupMarquee('album', album); }); }
        function updateArtwork(artwork) { const container = document.getElementById('art-container'); if (artwork && artwork !== currentArtwork) { currentArtwork = artwork; const image = document.createElement('img'); image.src = '/api/artwork?src=' + encodeURIComponent(artwork) + '&t=' + Date.now(); image.alt = 'Album Art'; image.onerror = () => { image.remove(); const placeholder = document.createElement('span'); placeholder.className = 'art-placeholder'; placeholder.textContent = '🎵'; container.replaceChildren(placeholder); }; container.replaceChildren(image); } else if (!artwork && currentArtwork) { currentArtwork = ''; const placeholder = document.createElement('span'); placeholder.className = 'art-placeholder'; placeholder.textContent = '🎵'; container.replaceChildren(placeholder); } }
        function resetTrackState(duration, paused, elapsed) { currentDuration = duration; lastKnownElapsed = clampElapsed(elapsed, duration); state = paused ? 'PAUSED' : 'PLAYING'; playStartTime = performance.now(); document.getElementById('time-duration').innerText = formatTime(duration); document.getElementById('time-elapsed').innerText = formatTime(lastKnownElapsed); document.getElementById('track-fill').style.width = (duration > 0 ? lastKnownElapsed / duration * 100 : 0) + '%'; }
        function updateProgress(data, trackChanged) { const paused = data.isPaused !== undefined ? Boolean(data.isPaused) : !Boolean(data.is_playing), elapsed = Number(data.elapsed) || 0, duration = Number(data.duration) || 0; if (trackChanged || duration !== currentDuration) resetTrackState(duration, paused, elapsed); else if (state !== 'PLAYING' && !paused) { lastKnownElapsed = clampElapsed(elapsed, duration); playStartTime = performance.now(); state = 'PLAYING'; } else if (state === 'PLAYING' && paused) { lastKnownElapsed = clampElapsed(lastKnownElapsed + (performance.now() - playStartTime) / 1000, duration); state = 'PAUSED'; } else if (state !== 'PLAYING' && paused) { lastKnownElapsed = clampElapsed(elapsed, duration); state = 'PAUSED'; } document.getElementById('play-btn').innerText = paused ? 'Play ▶' : 'Pause ❚❚'; document.getElementById('time-duration').innerText = formatTime(currentDuration); if (paused) { document.getElementById('time-elapsed').innerText = formatTime(lastKnownElapsed); document.getElementById('track-fill').style.width = (currentDuration > 0 ? lastKnownElapsed / currentDuration * 100 : 0) + '%'; } }
        function animateProgress() { if (state === 'PLAYING' && currentDuration > 0) { const elapsed = clampElapsed(lastKnownElapsed + (performance.now() - playStartTime) / 1000, currentDuration); document.getElementById('time-elapsed').innerText = formatTime(elapsed); document.getElementById('track-fill').style.width = (elapsed / currentDuration * 100) + '%'; } requestAnimationFrame(animateProgress); }
        requestAnimationFrame(animateProgress);
        async function updateStatus() { try { const response = await fetch('/api/status', { cache: 'no-store' }); const data = await response.json(); const album = data.album || EMPTY_ALBUM_TEXT; const trackSignature = `${data.title || ''}|${data.artist || ''}|${album}|${data.duration || 0}`; const trackChanged = activeSongSignature !== '' && trackSignature !== activeSongSignature; updateMarquees(data.title, data.artist, album); document.getElementById('vol-bar').style.width = Math.max(0, Math.min(100, Number(data.volume) || 0)) + '%'; updateProgress(data, trackChanged); updateArtwork(data.artwork); } catch (error) { console.error('Sync error:', error); } }
        function sendControl(action) { if (isSending) return; isSending = true; fetch('/control/' + encodeURIComponent(action)).then(() => setTimeout(updateStatus, 200)).catch(error => console.error('Control error:', error)).finally(() => { isSending = false; }); }
        setInterval(updateStatus, {{POLL_INTERVAL_MS}}); updateStatus();
    </script>
</body>
</html>
